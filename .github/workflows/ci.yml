name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # The lock file pins the versions the committed outputs were made with,
      # so the report, CSVs and charts can be compared byte for byte.
      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      # The committed snapshot must match its pinned hashes (no download: the
      # bulk file is 371 MB and changes daily).
      - name: Check the committed data
        run: python scripts/download_data.py

      # Rerun the Part 1 to 4 reports from the committed data; fail and
      # show the difference if any committed file changes.
      - name: Rebuild the reports, check nothing changed
        run: |
          python scripts/profile_report.py
          python scripts/sources_report.py
          python scripts/response_report.py
          python scripts/monitor_report.py
          git status --porcelain
          test -z "$(git status --porcelain)" || { git diff --stat; git diff -- "*.md" "*.csv" | head -200; exit 1; }

      - name: pytest
        run: pytest -q
